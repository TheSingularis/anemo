name: Build and Release

on:
  push:
    # dev is the integration branch every push lands on; main only ever advances
    # together with a tag (main == latest release), so it doesn't need its own
    # trigger here - the tags entry below covers it.
    branches: [ dev ]
    # Each app is tagged and released independently (widget-vX.Y.Z / scanner-vX.Y.Z)
    # since they ship on their own cadence, even though they live in one repo.
    tags: [ 'widget-v*', 'scanner-v*' ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Every dev push sanity-builds both apps as plain exes (no packaging) - cheap
      # confirmation that nothing is broken, without waiting for a real release.
      - name: Publish widget (sanity build)
        if: github.ref == 'refs/heads/dev'
        run: >
          dotnet publish Anemo.Widget.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-widget

      - name: Upload widget build artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: Anemo.Widget-win-x64
          path: publish-widget/Anemo.Widget.exe
          if-no-files-found: error

      - name: Publish scanner (sanity build)
        if: github.ref == 'refs/heads/dev'
        run: >
          dotnet publish Anemo.Scanner/Anemo.Scanner.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-scanner

      - name: Upload scanner build artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: Anemo.Scanner-win-x64
          path: publish-scanner/Anemo.Scanner.exe
          if-no-files-found: error

      # Everything below only runs for a tagged release, since Velopack packaging
      # (Setup.exe + portable zip + update feed) is only meaningful for a real
      # published version - the plain exes above are enough to sanity-check every push.
      - name: Determine release target
        if: startsWith(github.ref, 'refs/tags/')
        id: target
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like "widget-v*") {
            # Stays on Velopack's default "win" channel (no -c flag) - already-installed
            # copies expect releases.win.json, so this can never change without breaking
            # auto-update for everyone currently running the widget.
            echo "app_id=Anemo.Widget" >> $env:GITHUB_OUTPUT
            echo "csproj=Anemo.Widget.csproj" >> $env:GITHUB_OUTPUT
            echo "exe_name=Anemo.Widget.exe" >> $env:GITHUB_OUTPUT
            echo "version=$($ref -replace '^widget-v', '')" >> $env:GITHUB_OUTPUT
            echo "channel_args=" >> $env:GITHUB_OUTPUT
            echo "title=Anemo Widget" >> $env:GITHUB_OUTPUT
          } elseif ($ref -like "scanner-v*") {
            # Explicit channel keeps its release feed (releases.scanner.json) from ever
            # being confused with the widget's, since both live in this same repo.
            echo "app_id=Anemo.Scanner" >> $env:GITHUB_OUTPUT
            echo "csproj=Anemo.Scanner/Anemo.Scanner.csproj" >> $env:GITHUB_OUTPUT
            echo "exe_name=Anemo.Scanner.exe" >> $env:GITHUB_OUTPUT
            echo "version=$($ref -replace '^scanner-v', '')" >> $env:GITHUB_OUTPUT
            echo "channel_args=-c scanner" >> $env:GITHUB_OUTPUT
            echo "title=Anemo Scanner" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Unrecognized tag pattern: $ref"
            exit 1
          }

      - name: Publish self-contained single-file exe for release
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          dotnet publish ${{ steps.target.outputs.csproj }} -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Remove debug symbols before packaging
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Remove-Item -Path publish/*.pdb -ErrorAction SilentlyContinue

      - name: Install Velopack CLI
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet tool install -g vpk

      - name: Package release with Velopack
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >
          vpk pack -u ${{ steps.target.outputs.app_id }} -v ${{ steps.target.outputs.version }}
          -p publish -e ${{ steps.target.outputs.exe_name }} -o velopack-release --icon app.ico
          ${{ steps.target.outputs.channel_args }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }} velopack-release/*
          --title "${{ steps.target.outputs.title }} ${{ github.ref_name }}" --generate-notes
