name: Weekly storage cleanup

# Actions artifact storage counts against a shared, account-wide quota for
# private repos (hit account-wide in Sept 2026 — see the repo's other
# workflows for the retention-days fix that stops new artifacts from
# lingering past 7 days). retention-days only prevents *future* uploads from
# outliving that window; this is a weekly backstop that actively prunes
# anything already past it, and covers any artifact-producing step added
# later without an explicit retention-days set.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  prune-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%s)
          gh api "repos/$REPO/actions/artifacts" --paginate --jq '.artifacts[] | "\(.id)\t\(.created_at)"' |
          while IFS=$'\t' read -r id created; do
            created_ts=$(date -u -d "$created" +%s)
            if [ "$created_ts" -lt "$cutoff" ]; then
              echo "Deleting artifact $id (created $created)"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            fi
          done
